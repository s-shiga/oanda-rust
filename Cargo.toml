[package]
name = "oanda-rust"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/s-shiga/oanda-rust"
readme = "README.md"

[dependencies]
chrono = { version = "0.4.43", features = ["serde"] }
url = "2.5.8"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = "0.27.2"
strum_macros = "0.27.2"
thiserror = "1.0"
