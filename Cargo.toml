[package]
name = "oanda-rust"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/s-shiga/oanda-rust"
readme = "README.md"

[dependencies]
url = "2.5.8"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
